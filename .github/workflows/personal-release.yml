name: Personal desktop release

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ZCODE_ENV: production
  ZCODE_PERSONAL_IDENTITY: "1"
  ZCODE_AUTO_UPDATE: "0"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  npm_config_workspace_concurrency: "1"
  npm_config_fetch_timeout: "60000"
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win-x64, os: win, arch: x64, runner: windows-2022 }
          - { target: mac-x64, os: mac, arch: x64, runner: macos-15-intel }
          - { target: mac-arm64, os: mac, arch: arm64, runner: macos-15 }
          - { target: linux-x64, os: linux, arch: x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, os: linux, arch: arm64, runner: ubuntu-22.04-arm }
    defaults:
      run:
        shell: bash
    env:
      ZCODE_TARGET_OS: ${{ matrix.os }}
      ZCODE_TARGET_ARCH: ${{ matrix.arch }}
      ZCODE_ENABLE_MAC_SIGN: ${{ matrix.os == 'mac' && '1' || '0' }}
      CSC_NAME: ${{ matrix.os == 'mac' && '-' || '' }}
      USE_SYSTEM_FPM: "true"
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
          run_install: false
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby-dev libarchive-tools zstd xvfb xauth libgtk-3-0 libnss3 libgbm1 libasound2
          sudo gem install fpm --no-document
      - name: Install frozen dependencies
        run: |
          node scripts/assert-node-version.mjs
          pnpm install --frozen-lockfile
      - name: Validate release tooling and baseline
        if: matrix.target == 'linux-x64'
        run: |
          node --test scripts/test/personal-release.test.mjs scripts/test/desktop-dev-version.test.mjs scripts/test/personal-upstream-isolation.test.mjs
          pnpm exec vitest run packages/desktop/test/electronBuilderLinuxPackageTargets.test.ts
          node scripts/licenses.mjs check
          pnpm lint
          pnpm typecheck
      - name: Prepare native runtime
        run: pnpm prepare:desktop-runtime
      - name: Build desktop and workspace
        run: pnpm build:bootstrap
      - name: Package desktop
        run: pnpm bundle:desktop -- --os "$ZCODE_TARGET_OS" --arch "$ZCODE_TARGET_ARCH" --skip-prepare --skip-build
      - name: Verify native application startup
        timeout-minutes: 5
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/personal-release-smoke.mjs "$RELEASE_TARGET"
          else
            node scripts/personal-release-smoke.mjs "$RELEASE_TARGET"
          fi
      - name: Stage validated packages
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/personal-release.mjs stage packages/desktop/dist "dist/personal-release/$RELEASE_TARGET" "$RELEASE_TARGET" "dist/personal-release-validation/$RELEASE_TARGET/smoke.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.target }}
          path: dist/personal-release/${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.target }}
          path: dist/personal-release-validation/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

  draft:
    name: Assemble verified draft release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/release-input
      - name: Validate complete matrix and generate checksums
        run: node scripts/personal-release.mjs collect "$RUNNER_TEMP/release-input" "$RUNNER_TEMP/release-ready"
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing-release.json"; then
            node -e 'const r=require(process.env.RUNNER_TEMP+"/existing-release.json"); if(!r.isDraft || r.targetCommitish!==process.env.GITHUB_SHA) throw Error("Refusing to overwrite a published release or a different source commit")'
          else
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "ZCode Personal $version" --notes-file "docs/releases/$version.md"
          fi
          gh release upload "$tag" "$RUNNER_TEMP/release-ready/"* --clobber
          gh release view "$tag" --json url,tagName,isDraft,assets --jq '{url,tagName,isDraft,assets:[.assets[]|{name,size,digest}]}'

      # 本次用户明确授权正式发布；其他版本仍只生成草稿。
      - name: Publish authorized 3.17.1 Personal release
        if: github.ref == 'refs/heads/release/3.17.1-personal.1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v3.17.1-personal.1"
          release_id=$(gh release view "$tag" --json databaseId --jq .databaseId)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/uploaded-release.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, readdir, stat } from 'node:fs/promises';
          import { createReadStream } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const release = JSON.parse(await readFile(join(process.env.RUNNER_TEMP, 'uploaded-release.json'), 'utf8'));
          assert.equal(release.draft, true);
          assert.equal(release.target_commitish, process.env.GITHUB_SHA);
          const root = join(process.env.RUNNER_TEMP, 'release-ready');
          const names = await readdir(root);
          assert.equal(names.length, 15);
          assert.deepEqual(release.assets.map(a => a.name).sort(), [...names].sort());
          for (const name of names) {
            const asset = release.assets.find(a => a.name === name);
            const path = join(root, name);
            assert.equal(asset.size, (await stat(path)).size);
            const hash = createHash('sha256');
            for await (const chunk of createReadStream(path)) hash.update(chunk);
            assert.equal(asset.digest, 'sha256:' + hash.digest('hex'), name);
          }
          NODE
          gh release edit "$tag" --draft=false --prerelease=false --latest
