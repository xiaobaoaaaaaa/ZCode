name: Personal desktop and Android release

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ZCODE_ENV: production
  ZCODE_PERSONAL_IDENTITY: "1"
  ZCODE_AUTO_UPDATE: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  npm_config_workspace_concurrency: "1"
  npm_config_fetch_timeout: "60000"
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win-x64, os: win, arch: x64, runner: windows-2022 }
          - { target: mac-x64, os: mac, arch: x64, runner: macos-15-intel }
          - { target: mac-arm64, os: mac, arch: arm64, runner: macos-15 }
          - { target: linux-x64, os: linux, arch: x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, os: linux, arch: arm64, runner: ubuntu-22.04-arm }
    defaults:
      run:
        shell: bash
    env:
      ZCODE_TARGET_OS: ${{ matrix.os }}
      ZCODE_TARGET_ARCH: ${{ matrix.arch }}
      ZCODE_ENABLE_MAC_SIGN: ${{ matrix.os == 'mac' && '1' || '0' }}
      CSC_NAME: ${{ matrix.os == 'mac' && '-' || '' }}
      USE_SYSTEM_FPM: "true"
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
          run_install: false
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby-dev libarchive-tools zstd xvfb xauth libgtk-3-0 libnss3 libgbm1 libasound2
          sudo gem install fpm --no-document
      - name: Install frozen dependencies
        run: |
          node scripts/assert-node-version.mjs
          # pnpm hoisted 副本写入会与补丁 chdir/嵌套目标竞争；串行构建保留完整安装脚本。
          pnpm install --frozen-lockfile --child-concurrency=1
      - name: Validate release tooling and baseline
        if: matrix.target == 'linux-x64'
        run: |
          node --test scripts/test/personal-release.test.mjs scripts/test/desktop-dev-version.test.mjs scripts/test/personal-upstream-isolation.test.mjs
          pnpm exec vitest run packages/desktop/test/electronBuilderLinuxPackageTargets.test.ts
          node scripts/licenses.mjs check
          pnpm lint
          pnpm typecheck
      - name: Verify Personal update runtime
        if: matrix.target == 'linux-x64'
        run: xvfb-run -a node packages/desktop/scripts/personal-update-smoke.mjs
      - name: Prepare native runtime
        run: pnpm prepare:desktop-runtime
      - name: Build desktop and workspace
        run: pnpm build:bootstrap
      - name: Package desktop
        run: pnpm bundle:desktop -- --os "$ZCODE_TARGET_OS" --arch "$ZCODE_TARGET_ARCH" --skip-prepare --skip-build
      - name: Verify native application startup
        timeout-minutes: 5
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/personal-release-smoke.mjs "$RELEASE_TARGET"
          else
            node scripts/personal-release-smoke.mjs "$RELEASE_TARGET"
          fi
      - name: Stage validated packages
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/personal-release.mjs stage packages/desktop/dist "dist/personal-release/$RELEASE_TARGET" "$RELEASE_TARGET" "dist/personal-release-validation/$RELEASE_TARGET/smoke.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.target }}
          path: dist/personal-release/${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.target }}
          path: dist/personal-release-validation/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Build signed Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.33.2
          run_install: false
      - run: pnpm install --frozen-lockfile --child-concurrency=1
      # CI runner 不保证 sdkmanager 在 PATH；显式准备固定版本的工具链。
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"
      - name: Build and verify signed release
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: personal
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERTIFICATE_SHA256: ${{ secrets.ANDROID_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/personal-android.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          node --test scripts/test/android-release.test.mjs
          packages/android/gradlew -p packages/android :app:assembleRelease :app:lintRelease --console=plain
          apk=packages/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-cert.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-cert.txt")
          test "$actual" = "$ANDROID_CERTIFICATE_SHA256"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='io.github.xiaobaoaaaaaa.zcode'" "$RUNNER_TEMP/apk-badging.txt"
          version=$(node -p "require('./package.json').version")
          code=$(sed -n 's/^VERSION_CODE=//p' packages/android/version.properties)
          grep -q "versionCode='$code' versionName='$version'" "$RUNNER_TEMP/apk-badging.txt"
          node scripts/android-release.mjs stage "$apk" dist/android-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release
          path: dist/android-release
          if-no-files-found: error
          compression-level: 0

  draft:
    name: Assemble verified draft release
    needs: [build, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/release-input
      - name: Validate complete matrix and generate checksums
        run: node scripts/personal-release.mjs collect "$RUNNER_TEMP/release-input" "$RUNNER_TEMP/release-ready"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-release
          path: ${{ runner.temp }}/android-release
      - name: Validate Android provenance and append checksums
        run: node scripts/android-release.mjs collect "$RUNNER_TEMP/android-release" "$RUNNER_TEMP/release-ready"
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing-release.json"; then
            node -e 'const r=require(process.env.RUNNER_TEMP+"/existing-release.json"); if(!r.isDraft || r.targetCommitish!==process.env.GITHUB_SHA) throw Error("Refusing to overwrite a published release or a different source commit")'
          else
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "ZCode Personal $version" --notes-file "docs/releases/$version.md"
          fi
          gh release upload "$tag" "$RUNNER_TEMP/release-ready/"* --clobber
          gh release view "$tag" --json url,tagName,isDraft,assets --jq '{url,tagName,isDraft,assets:[.assets[]|{name,size,digest}]}'
